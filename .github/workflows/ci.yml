name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 已切到 26.04，该镜像没有 py3.9 的预编译包，
        # 所以 3.9 这一格钉在 22.04；3.12 走最新镜像。
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 零第三方依赖：不起服务、不装包，直接跑标准库测试
      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 端到端冒烟（隔离 HOME，不联网）
        run: bash tests/smoke.sh
